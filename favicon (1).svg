<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Auto Service Favicon</title>
  <circle cx="256" cy="256" r="256" fill="#DB2512"/>
  <!-- Wrench -->
  <g fill="#FFFFFF" transform="translate(256 256) rotate(-35) translate(-256 -256)">
    <!-- Handle -->
    <rect x="135" y="245" width="300" height="70" rx="35" ry="35"/>
    <!-- Head (ring) -->
    <circle cx="410" cy="215" r="85"/>
    <circle cx="410" cy="215" r="48" fill="#DB2512"/>
    <!-- Opening cut -->
    <rect x="445" y="170" width="120" height="70" fill="#DB2512" transform="rotate(35 445 170)"/>
    <!-- Tail cap -->
    <circle cx="160" cy="310" r="48"/>
    <circle cx="160" cy="310" r="22" fill="#DB2512"/>
  </g>
</svg>
